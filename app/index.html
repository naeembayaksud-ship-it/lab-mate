<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Mate</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts-plus-jakarta-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts-plus-jakarta-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts-newsreader-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1a1f26;--mut:#4a5565;--line:#d8dce3;--soft:#eef0f4;--acc:#1c4fb8;--accbg:#e7eefb;--onacc:#fff;
--ok:#0f5a2b;--okbg:#ddf2e4;--bad:#8a1c1c;--badbg:#fde4e4;--warn:#664600;--warnbg:#fff1c4;--info:#173a85;--infobg:#dbe7fb;--gray:#38404b;--graybg:#e6e9ee;--hl:#ffe27a;
--shadow:0 1px 2px rgba(20,30,50,.07);--r:10px}
[data-theme=dark]{--bg:#111418;--panel:#1a1f26;--ink:#e7eaef;--mut:#aab2be;--line:#363f4c;--soft:#232a33;--acc:#8ab4ff;--accbg:#1d2b48;--onacc:#0b1220;
--ok:#9be3b0;--okbg:#16361f;--bad:#ffb4b4;--badbg:#431a1a;--warn:#ffd97a;--warnbg:#3f3209;--info:#b6cffd;--infobg:#1b2d52;--gray:#d0d6de;--graybg:#2a313b;--hl:#6b5a00;--shadow:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.5;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
button.pri:hover:not(:disabled){filter:brightness(1.08)}
button.sm{padding:3px 9px;font-size:13px}
button.ghost{border-color:transparent;background:transparent;color:var(--acc)}
button.ghost:hover:not(:disabled){background:var(--accbg)}
button.lnk{border:0;background:none;padding:0;color:var(--acc);text-decoration:underline;border-radius:3px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical}
h2{font-size:20px;margin:0 0 4px}h3{font-size:16px;margin:18px 0 6px}
.mut{color:var(--mut)}.small{font-size:13px}
#app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
aside h1{font-size:16px;margin:0}
aside .brand{display:flex;align-items:center;gap:8px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:800;font-size:14px}
.pitem{display:flex;align-items:center;gap:2px;border:1px solid transparent;border-radius:8px;padding:2px 4px}
.pitem:hover{background:var(--soft)}
.pitem.on{background:var(--accbg);border-color:var(--acc)}
.pitem .nm{flex:1;text-align:left;border:0;background:none;padding:5px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .x{border:0;background:none;color:var(--mut);padding:3px 7px}
main{padding:14px 22px 90px;min-width:0;max-width:1500px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.step{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:30px;padding:5px 14px 5px 6px;background:var(--panel)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--graybg);color:var(--gray);font-size:13px;font-weight:700}
.step.done .n{background:var(--okbg);color:var(--ok)}
.step.on{border-color:var(--acc);background:var(--accbg)}
.step.on .n{background:var(--acc);color:var(--onacc)}
.step:disabled{opacity:.55}
.guide{color:var(--mut);margin:2px 2px 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.chip{display:inline-flex;gap:5px;align-items:center;border-radius:14px;padding:1px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-bad{background:var(--badbg);color:var(--bad)}.c-warn{background:var(--warnbg);color:var(--warn)}
.c-info{background:var(--infobg);color:var(--info)}.c-gray{background:var(--graybg);color:var(--gray)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--mut);white-space:nowrap}
.banner{padding:9px 14px;border-radius:9px;margin-bottom:12px}
.fict{background:var(--warnbg);color:var(--warn);border:2px dashed var(--warn);font-weight:700}
.err{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.note{background:var(--accbg);border-left:4px solid var(--acc);border-radius:6px;padding:8px 12px;font-size:14px;margin:8px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);padding:5px 12px}
.seg button.on{background:var(--acc);color:var(--onacc);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.pane{max-height:calc(100vh - 230px);overflow:auto}
.pages .pg{border-bottom:1px solid var(--line);padding:10px 14px}
.pages .pg h3{margin:0 0 6px;font-size:12px;letter-spacing:.05em;color:var(--mut)}
.pages pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,Consolas,monospace}
.pg.flash{background:var(--accbg)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px;outline:2px solid var(--warn)}
.prow{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;background:var(--panel)}
.prow .top{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.prow .nm{font-weight:600;flex:1 1 180px}
.prow .val{flex:1 1 140px;word-break:break-word}
.prow .edit{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.prow.open .edit{display:block}
.grid3{display:grid;grid-template-columns:2fr 1.4fr 1fr;gap:6px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.tabs button{border-radius:20px;padding:3px 11px;font-size:13px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.dz{border:2px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;background:var(--panel)}
.dz.over{border-color:var(--acc);background:var(--accbg)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.how b{display:block;margin-bottom:2px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:14px}
th{background:var(--soft);color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;z-index:1}
tr.chg td:first-child{box-shadow:inset 4px 0 0 var(--acc)}
tr.chg{background:var(--accbg)}
td input{padding:4px 7px}
.msgs{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0}
.msg{max-width:92%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--accbg);border:1px solid var(--acc)}
.msg.a{align-self:flex-start;background:var(--soft);border:1px solid var(--line)}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ex button{font-size:12.5px;border-radius:16px;padding:2px 10px;color:var(--acc)}
.rc{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label.f{display:block;font-size:12.5px;color:var(--mut)}
.verd{border-left:8px solid var(--ok)}
.verd.w{border-left-color:var(--warn);background:var(--warnbg)}
.verd .big{font-size:22px;font-weight:800;margin:2px 0}
.hyp{border-left:4px solid var(--acc)}
.hyp .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rank{font-size:20px;font-weight:800;color:var(--acc)}
.ev{margin:4px 0;font-size:14px}
.badge{display:inline-flex;gap:4px;align-items:center;border-radius:5px;padding:0 7px;font-size:12px;font-weight:700;margin-right:6px}
.tl{border-left:3px solid var(--line);margin-left:12px;padding-left:18px}
.tl .st{position:relative}
.tl .st::before{content:attr(data-n);position:absolute;left:-37px;top:12px;background:var(--acc);color:var(--onacc);width:24px;height:24px;border-radius:50%;text-align:center;font-size:13px;line-height:24px;font-weight:700}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 12px;margin:8px 0;font-size:14px}
dl.kv dt{color:var(--mut)}dl.kv dd{margin:0}
#job{position:sticky;top:0;z-index:20}
.jobc{background:var(--panel);border:1px solid var(--acc);border-radius:10px;padding:10px 14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.bar{height:9px;background:var(--graybg);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc);transition:width .6s}
#foot{position:fixed;left:250px;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:9px 22px;display:flex;gap:10px;align-items:center;z-index:15}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:8px;display:none;z-index:60;max-width:90vw}
#saved{font-size:12.5px;color:var(--mut)}
@media(max-width:1000px){#app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.split{grid-template-columns:1fr}.pane{max-height:none}#foot{left:0}}

/* method flowchart */
.mf-sum{display:flex;flex-direction:column;gap:8px}
.mf-sum .lead{font-size:15px;line-height:1.5;margin:0;max-width:980px}
.mf-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}
.mf-leg span{display:inline-flex;align-items:center;gap:5px}.mf-leg i{width:11px;height:11px;border-radius:3px;border:1.5px solid}
.mf-band{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:stretch}
.mf-rail{border-left:4px solid var(--line);padding:2px 0 2px 10px;align-self:start;position:sticky;top:8px}
.mf-rail b{display:block;font-size:14px;line-height:1.25}.mf-rail span{font-size:12px;color:var(--mut)}
.mf-grid{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));column-gap:22px}
.mwrap{grid-column:1/-1;height:30px;position:relative;--cw:calc((100% - (var(--c) - 1)*22px)/var(--c))}
.mwrap i{position:absolute;background:var(--mut)}
.mwrap .a{left:calc(100% - var(--cw)/2 - 1px);top:0;width:2px;height:15px}
.mwrap .b{left:calc(var(--cw)/2 - 1px);right:calc(var(--cw)/2 - 1px);top:14px;height:2px}
.mwrap .c{left:calc(var(--cw)/2 - 1px);top:15px;width:2px;height:15px}
.mwrap .c::after{content:"";position:absolute;left:-5px;bottom:-2px;border:6px solid transparent;border-top:8px solid var(--mut);border-bottom:0}
.mf-dn{display:grid;grid-template-columns:130px 1fr;gap:14px;height:34px}
.mf-dn i{grid-column:2;justify-self:center;width:2px;background:var(--mut);position:relative;margin:2px 0 8px}
.mf-dn i::after{content:"";position:absolute;left:-5px;bottom:-8px;border:6px solid transparent;border-top:8px solid var(--mut);border-bottom:0}
.mc{position:relative;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--k);border-radius:10px;padding:11px 13px 10px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.mc.flash{outline:3px solid var(--acc)}
.mc header{display:flex;gap:9px;align-items:flex-start}
.mc h3{margin:0;font-size:14px;line-height:1.3}
.mb{flex:none;min-width:24px;height:24px;border-radius:12px;background:var(--k);color:var(--kt);font:700 13px/24px system-ui,sans-serif;text-align:center;padding:0 4px}
.mtag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.mtag em{font-style:normal;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--kbg);color:var(--kt2);border-radius:5px;padding:1px 6px}
.mc p{margin:0;font-size:13px;line-height:1.5}
.mset{display:flex;flex-wrap:wrap;gap:5px}
.mset span{font-size:12px;background:var(--graybg);border-radius:6px;padding:2px 7px;line-height:1.4}.mset b{font-weight:600}
.mout{font-size:12.5px;line-height:1.4;border-top:1px dashed var(--line);padding-top:6px}.mout b{color:var(--mut);font-weight:600}
.mrel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-top:auto}
.mref{border:1px solid var(--line);background:var(--panel);border-radius:11px;min-width:22px;height:22px;padding:0 5px;font:600 12px/20px system-ui,sans-serif;cursor:pointer}
.mloop{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:2px 7px}
.mq{margin-left:auto}
.mq.bad{background:var(--badbg);color:var(--bad);border-radius:6px;padding:2px 7px;font-size:12px}
.mar{position:absolute;right:-22px;top:50%;width:22px;height:2px;background:var(--mut)}
.mar::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:8px solid var(--mut);border-right:0}
.mc.eor .mar{display:none}
.mk-info{--k:var(--info);--kbg:var(--infobg);--kt:#fff;--kt2:var(--info)}.mk-warn{--k:var(--warn);--kbg:var(--warnbg);--kt:#fff;--kt2:var(--warn)}
.mk-acc{--k:var(--acc);--kbg:var(--accbg);--kt:var(--onacc);--kt2:var(--acc)}.mk-ok{--k:var(--ok);--kbg:var(--okbg);--kt:#fff;--kt2:var(--ok)}.mk-gray{--k:var(--gray);--kbg:var(--graybg);--kt:#fff;--kt2:var(--gray)}
[data-theme=dark] .mb{color:#0b0f14}
@media(max-width:900px){.mf-band,.mf-dn{grid-template-columns:1fr}.mf-rail{position:static}.mf-dn i{grid-column:1}.mf-grid{grid-template-columns:1fr;row-gap:22px}.mwrap{display:none}
 .mar{right:auto;left:50%;top:auto;bottom:-22px;width:2px;height:22px}.mar::after{right:auto;left:-5px;top:auto;bottom:-1px;border:6px solid transparent;border-top:8px solid var(--mut);border-bottom:0}
 .mc.eor .mar{display:block}.mc.last .mar{display:none}}
@media print{.mf-rail{position:static}.mc{break-inside:avoid}}
@media print{aside,.stepper,.noprint,button,#foot,#job,.guide{display:none!important}#app{display:block}body{background:#fff;color:#000}.card{break-inside:avoid;box-shadow:none}main{padding:0}}

/* ---- UX pass: tokens, targets, flowcharts, dialog ---- */
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:var(--onacc);padding:8px 14px;border-radius:8px;z-index:100}.skip:focus{left:8px}
button,input,select,textarea{min-height:34px}
input[type=checkbox]{min-height:0}
@media(pointer:coarse){button,input,select,textarea{min-height:44px}}
table{font-variant-numeric:tabular-nums}
.stepper{position:sticky;top:0;z-index:18;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:8px 0;margin:0 0 6px}
#foot{background:color-mix(in srgb,var(--panel) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pitem .x{display:grid;place-items:center;min-width:34px;border-radius:7px}
.pitem .x:hover{background:var(--soft);color:var(--ink)}
.pitem .del{opacity:0;transition:opacity .15s}.pitem:hover .del,.pitem:focus-within .del,.pitem.on .del{opacity:1}
.pitem .del:hover{color:var(--bad);background:var(--badbg)}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:20px;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.flowwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px}
.flowwrap svg{display:block;margin:0 auto;height:auto}
.fn rect{stroke-width:1.5}.fn text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}.fn .ft{font-weight:700}
.fn-ok rect{fill:var(--okbg);stroke:var(--ok)}.fn-bad rect{fill:var(--badbg);stroke:var(--bad)}.fn-warn rect{fill:var(--warnbg);stroke:var(--warn)}
.fn-info rect{fill:var(--infobg);stroke:var(--info)}.fn-gray rect{fill:var(--graybg);stroke:var(--gray)}.fn-acc rect{fill:var(--accbg);stroke:var(--acc)}
.fn[role=button]{cursor:pointer}.fn[role=button]:hover rect,.fn[role=button]:focus-visible rect{stroke-width:3.5}.fn:focus-visible{outline:none}
.fe{fill:none;stroke:var(--mut);stroke-width:1.6;stroke-linecap:round}
.felb{fill:var(--panel);stroke:var(--line);stroke-width:1}
.fn .fs{stroke:none}.fn-ok .fs{fill:var(--ok)}.fn-bad .fs{fill:var(--bad)}.fn-warn .fs{fill:var(--warn)}.fn-info .fs{fill:var(--info)}.fn-gray .fs{fill:var(--gray)}.fn-acc .fs{fill:var(--acc)}
.fn .fb{fill:var(--ink);stroke:var(--panel);stroke-width:2}.fn .fbt{font:700 11px system-ui,sans-serif;fill:var(--panel)}
.kwb{height:6px;background:var(--soft);border-radius:3px;width:70px;margin-bottom:3px}.kwb i{display:block;height:100%;background:var(--acc);border-radius:3px}
.figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.fig{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel)}.fig img{width:100%;height:auto;display:block;border-radius:6px;background:#fff}.fig figcaption{margin-top:6px}
.grp{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel)}.grp>summary{padding:8px 12px;cursor:pointer}.grp>.card,.grp>div{margin-left:8px;margin-right:8px}.gk{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 2px 2px}
.mapt{font:600 12px system-ui,sans-serif;fill:var(--mut)}.mapn{font:13px system-ui,sans-serif;fill:var(--ink)}.mapm{font:11.5px system-ui,sans-serif;fill:var(--mut)}.mapc{cursor:pointer}.mapc:focus-visible rect,.mapc:hover rect{stroke-width:3}.cand.flash{outline:3px solid var(--acc);outline-offset:2px}
.fel{font:12px system-ui,sans-serif;fill:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:8px 2px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid;vertical-align:-2px;margin-right:5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media(prefers-contrast:more){:root{--line:#6b7380;--mut:#2b3340}}
@media(prefers-reduced-transparency:reduce){.stepper,#foot{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}}
@media print{.flowwrap{break-inside:avoid}}
.stepper .step{padding-right:10px;gap:6px}
.step .tl{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.step small{font-size:11px;color:var(--mut);font-weight:400}
.askbtn{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
.tag2{font-size:12px;color:var(--mut)}
.clcols{columns:2;column-gap:28px}
@media(max-width:900px){.clcols{columns:1}}
.clcols .clrow{break-inside:avoid}
details.cld>summary{cursor:pointer;font-weight:600;padding:2px 0}

/* ===== Dashboard skin (Diagnose design guideline): dark sidebar, pill navigation, pastel stat cards, dotted workspace.
   Text floor is 12px and touch targets stay >= 30px (36px for primary controls), per the WCAG 2.2 / Fitts-law rules in the installed UX skills. ===== */
:root{--bg:#fafbfa;--panel:#fff;--ink:#191b1e;--mut:#5b5f66;--line:#e5e7e5;--soft:#f4f5f4;--acc:#2b2c33;--accbg:#efeefa;--onacc:#fff;--r:18px;--shadow:none;
--pill:#1a1b1f;--onpill:#fff;--lav:#f0efff;--sky:#e4f2f6;--rose:#f7eaf0;--onpastel:#25252d;--side:#18191d;--link:#3a45a8}
[data-theme=dark]{--bg:#16191d;--panel:#20242a;--ink:#eef0f4;--mut:#b6bbc4;--line:#373c45;--soft:#292e35;--acc:#d8d5ff;--accbg:#363449;--onacc:#1c1a2b;
--pill:#d8d5f2;--onpill:#18171e;--lav:#343248;--sky:#243c44;--rose:#412f3a;--onpastel:#eeeafb;--side:#101216;--link:#b9c2ff}
body{font:14px/1.55 "Segoe UI",Inter,system-ui,sans-serif;background:#c4d9cb;padding:18px}
[data-theme=dark] body{background:#293d33}
a{color:var(--link)}
button{border-radius:999px;padding:6px 14px;min-height:36px;font-weight:550}
button.sm{padding:3px 11px;min-height:30px;font-size:13px}
button.pri{background:var(--pill);border-color:var(--pill);color:var(--onpill);font-weight:600}
button.pri:hover:not(:disabled){filter:none;opacity:.88}
button.ghost{color:var(--ink)}
button.lnk{min-height:0;color:var(--link);font-weight:500}
input,textarea,select{border-radius:12px;min-height:36px;padding:7px 12px}
input[type=checkbox],input[type=radio]{min-height:0}
h2{font-size:22px;letter-spacing:-.4px}h3{font-size:16px}
h2,h3,h4,p{overflow-wrap:anywhere}

/* shell */
#app{grid-template-columns:224px minmax(0,1fr);max-width:1680px;min-height:calc(100vh - 36px);margin:0 auto;border-radius:26px;overflow:clip;background:var(--bg)}
#app>aside{background:var(--side);color:#e4e6e9;border:0;height:calc(100vh - 36px);top:18px;padding:22px 16px;gap:12px;z-index:25}
#app>aside .brand{gap:10px}#app>aside h1{font-size:20px;font-weight:650;letter-spacing:-.5px}
#app>aside .logo{width:34px;height:34px;border-radius:11px;background:#fff;color:#191b1e;font-size:20px;letter-spacing:-1px}
#app>aside .mut,#app>aside .small{color:#b8bbc4}
#app>aside button{background:#27282e;color:#e6e7ec;border-color:#3b3d45}
#app>aside button:hover:not(:disabled){border-color:#8d88bd}
#app>aside .pri{background:#eeecff;border-color:#eeecff;color:#252332}
#app>aside .pitem button{background:none;border:0}
#app>aside :focus-visible{outline-color:#d8d5ff}
.sidebar-caption{font-size:12px;letter-spacing:.1em;color:#a9adb6;margin:0;font-weight:600;text-transform:uppercase}
.project-search{display:grid;gap:6px;font-size:12px;color:#b8bbc4}
.project-search input{background:#27282e;border-color:#3b3d45;color:#fff}
.project-search input::placeholder{color:#a6aab4}
#plist{min-height:60px}
.pitem{margin:3px 0;padding:0 2px;min-width:0}
.pitem.on{background:#3a3b44;border-color:#4c4d57}.pitem:hover{background:#2d2f35}
.pitem .nm{font-size:13px;color:#e6e7ec;min-width:0;min-height:34px}
.pitem .x{color:#b8bac3}
main{padding:0 28px 100px;max-width:none;background-image:radial-gradient(var(--line) .9px,transparent .9px);background-size:22px 22px}
.workspace-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0 2px;font-size:13px;color:var(--mut);min-height:52px}
.workspace-top .crumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.workspace-top b{color:var(--ink);font-weight:600}
.top-divider{margin:0 8px}
.topact{display:flex;gap:8px;align-items:center;flex:none}
#saved{font-size:12px;color:var(--mut);max-width:150px}
.askbtn{background:var(--pill);border-color:var(--pill);color:var(--onpill)}

/* step navigation: five pills, one job per tab */
.stepper{position:relative;top:auto;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin:8px 0 14px;padding:2px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;z-index:1;scrollbar-width:thin}
.step{flex:1 1 0;min-width:136px;border:0;background:var(--soft);border-radius:999px;padding:7px 14px 7px 7px;gap:9px;text-align:left}
.step .n{background:var(--panel);color:var(--mut);width:26px;height:26px;font-size:12px;flex:none}
.step .slb{display:block;font-weight:600;font-size:13px;line-height:1.2}
.step .slb small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.step:hover:not(:disabled):not(.on){background:var(--accbg)}
.step.on{background:var(--pill);color:var(--onpill)}
.step.on .slb small{color:inherit;opacity:.78}
.step.on .n{background:rgba(255,255,255,.2);color:inherit}
[data-theme=dark] .step.on .n{background:rgba(0,0,0,.14)}
.step.done:not(.on) .n{background:var(--okbg);color:var(--ok)}

/* stage header and real-count stat cards */
.guide{margin:0;color:inherit}
.eyebrow{font-size:12px;letter-spacing:.1em;font-weight:600;color:var(--mut);text-transform:uppercase}
.stage-intro{margin:2px 0 12px}
.stage-intro h2{font-size:26px;font-weight:620;letter-spacing:-.6px;margin:2px 0 0;line-height:1.2}
.stage-intro p{margin:4px 0 0;max-width:780px;color:var(--mut);font-size:13.5px}
.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.metric{border-radius:18px;padding:12px 16px;background:var(--lav);color:var(--onpastel);display:flex;align-items:center;gap:14px;min-height:68px}
.metric:nth-child(2){background:var(--sky)}.metric:nth-child(3){background:var(--rose)}
.metric strong{font-size:30px;font-weight:620;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.metric span{display:block;font-size:13px;font-weight:600;line-height:1.25}
.metric small{display:block;font-size:12px;opacity:.75;line-height:1.3;margin-top:1px}
.home-metrics .metric{min-height:92px}.home-metrics .metric strong{font-size:38px}

/* home */
.welcome{margin:8px 0 16px}
.welcome h2{font-size:34px;font-weight:350;letter-spacing:-1.2px;line-height:1.2;margin:6px 0}
.welcome h2 strong{font-weight:650}
.welcome p{margin:6px 0 0;color:var(--mut);max-width:680px;font-size:14px}
.entry-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin:0 0 14px}
.dashboard-panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.section-heading h3{margin:0;font-size:16px;font-weight:650}
.count-pill{white-space:nowrap;background:var(--soft);border-radius:99px;padding:3px 11px;font-size:12px;color:var(--mut)}
.dz{padding:22px 18px;min-height:210px;border:1.5px dashed var(--mut);border-radius:18px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.dz.over{border-color:var(--pill);background:var(--accbg)}
.dz h3{font-size:16px;margin:6px 0 0}.dz p{margin:0;font-size:13px;color:var(--mut);max-width:440px}
.upload-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--panel);font-size:22px}
.recent-list{display:flex;flex-direction:column}
.recent-project{display:flex;align-items:center;gap:10px;padding:9px 6px;border:0;border-bottom:1px solid var(--line);border-radius:0;width:100%;text-align:left;background:transparent;min-height:52px}
.recent-project:last-child{border-bottom:0}.recent-project:hover:not(:disabled){background:var(--soft);border-color:var(--line)}
.recent-project>span:nth-child(2){min-width:0;flex:1}
.recent-project b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:550}
.recent-project small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.paper-icon{width:32px;height:36px;display:grid;place-items:center;background:var(--soft);border-radius:10px;font-size:15px;flex:none}
.recent-empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:13px}.recent-empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0}
.how>div{background:var(--soft);border:0;border-radius:16px;padding:14px 16px;font-size:13px;color:var(--mut)}
.how>div b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.journey-number{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mut);margin-bottom:4px}
.help-details{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 18px;margin:0 0 14px;font-size:13px}
.help-details summary{cursor:pointer;font-weight:600;min-height:28px;display:flex;align-items:center}
.help-details[open]>summary{margin-bottom:10px}

/* surfaces */
.card{border-radius:20px;padding:16px 18px;margin-bottom:12px}
.note{background:var(--soft);border-left:3px solid var(--mut);border-radius:12px;font-size:13px;padding:9px 13px}
.chip{border-radius:99px;font-size:12px;min-height:22px}.tag{border-radius:99px;font-size:12px;padding:1px 9px}
.seg{border:0;border-radius:99px;background:var(--soft);padding:3px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{border-radius:99px;background:transparent;border:0;min-height:30px;padding:3px 13px;font-size:13px}
.seg button.on{background:var(--pill);color:var(--onpill)}
.tabs button{border-radius:99px;min-height:30px;font-size:13px;padding:3px 12px}
.tabs button.on{background:var(--pill);border-color:var(--pill);color:var(--onpill)}
.prow{border-radius:14px}.rc{border-radius:16px}
.tw{border-radius:16px}th{font-size:12px}th,td{padding:10px 11px}
.flowwrap{border-radius:18px;background:var(--soft)}
.mc{border-radius:16px;box-shadow:none}
.verd{border-left-width:5px}.hyp{border-left:4px solid var(--mut)}
.jobc{border-radius:18px;border-color:var(--mut)}.bar{height:5px}
.msg{font-size:14px}
dialog{border-radius:22px}
.askd{border-radius:22px 0 0 22px;overflow:hidden}
#job{top:10px}
#toast{border-radius:99px}
#foot{left:calc(224px + 18px);right:18px;bottom:18px;padding:10px 24px;border:0;border-top:1px solid var(--line);border-radius:0 0 26px 0;background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}

:root{--link-ink:#9C3F25;--bg:#F9F8F6;--panel:#F9F8F6;--elevated:#FFFFFF;--soft:#F0EFEA;--ink:#0A1526;--mut:#525866;--line:#E2E0D8;--line-strong:#0A1526;

--r:6px;--shadow:none;--ease:cubic-bezier(.22,1,.36,1);--serif:"Newsreader","Instrument Serif","Tiempos Text",Georgia,serif;
--sans:"Plus Jakarta Sans",Inter,Montserrat,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
[data-theme=dark]{--link-ink:#F0A58B;--bg:#0A1526;--panel:#0A1526;--elevated:#16253D;--soft:#111D31;--ink:#F9F8F6;--mut:#C3C8D2;--line:#26344B;--line-strong:#F9F8F6;
--acc:#F9F8F6;--accbg:#1E3250;--onacc:#0A1526;--accent:#D97757;--accent-ink:#F0A58B;--link:#F0A58B;--pill:#F9F8F6;--onpill:#0A1526;
--side:#111D31;--lav:#111D31;--sky:#111D31;--rose:#111D31;--onpastel:#F9F8F6;--field:#111D31;--field-line:#6F7E98;
--ok:#9BDDB0;--okbg:#14301F;--bad:#FFB4A6;--badbg:#42201A;--warn:#F2D27A;--warnbg:#3A2E0C;--info:#B9CDF2;--infobg:#1B2D4D;--gray:#D2D7E0;--graybg:#1D2B42;--hl:#6B5A00}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{font:15px/1.55 var(--sans);font-weight:400;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;line-height:1.15}
h2{font-size:26px}h3{font-size:18px}
.mono,.tag,.chip,.eyebrow,.count-pill,.journey-number,.sidebar-caption,code,kbd{font-family:var(--mono)}
.eyebrow,.sidebar-caption,.journey-number{font-size:12px;letter-spacing:.06em;font-weight:500;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}
.tag{font-size:12px;border-radius:4px;border:1px solid var(--line);color:var(--mut);padding:0 6px}
.chip{font-size:12px;font-weight:500;border-radius:4px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);padding:1px 8px}
.c-bad,.c-ok,.c-warn,.c-info,.c-gray{font-weight:500}
a{color:var(--link-ink);text-decoration-thickness:1px;text-underline-offset:3px;transition:text-decoration-color .3s var(--ease)}
a:hover{text-decoration-thickness:2px}
::selection{background:var(--accent);color:#0A1526}
/* buttons */
button{background:transparent;border:1px solid var(--ink);border-radius:4px;color:var(--ink);transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease),color .3s var(--ease)}
button:hover:not(:disabled){background:var(--soft);border-color:var(--ink)}
button.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
button.pri:hover:not(:disabled){background:var(--ink);opacity:.9;transform:translateY(-1px)}
button.cta,.cta{background:var(--accent);border-color:var(--accent);color:#0A1526;font-weight:700}
button.cta:hover:not(:disabled){background:var(--accent);filter:brightness(1.05);transform:translateY(-1px)}
button.ghost{border-color:transparent}
button.lnk{border:0;color:var(--link-ink);background:none}
button.lnk:hover:not(:disabled){background:none;text-decoration:underline}
button.sm{font-size:13px;min-height:30px}
button,.step,.ph{min-height:36px}
.askbtn{background:var(--ink);border-color:var(--ink);color:var(--bg);border-radius:999px;padding:6px 18px;font-weight:700}
.askbtn:hover:not(:disabled){background:var(--ink);opacity:.9}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[data-theme=dark] :focus-visible{outline-color:var(--accent-ink)}
input,select,textarea{background:var(--field);border:1px solid var(--field-line);border-radius:4px;color:var(--ink);transition:border-color .3s var(--ease)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--mut)}
/* surfaces */
.card,.dashboard-panel,.help-details,.gdet,.gsvg{background:transparent;border:1px solid var(--line);border-radius:6px;box-shadow:none;transition:border-color .3s var(--ease),background .3s var(--ease)}
.card:hover,.dashboard-panel:hover{border-color:var(--ink)}
.card.verd,.note{background:var(--soft)}
.note{border-left:4px solid var(--accent);border-radius:4px}
.askd,dialog,#toast{background:var(--elevated);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.askd{border-radius:0;border-width:0 0 0 1px;box-shadow:-8px 0 24px rgba(10,21,38,.08)}
.banner{border-radius:4px}
.how>div,.dz,.paper-icon,.count-pill{border-radius:6px}
.how>div{background:var(--soft)}
th{background:var(--soft)}
td.num,td input,.tw td:nth-child(n+2){font-variant-numeric:tabular-nums}
.tw table td.num,.tbl td.num{font-family:var(--mono)}
/* shell */
#app{grid-template-columns:232px minmax(0,1fr)}
#app>aside{background:var(--soft);color:var(--ink);border-right:1px solid var(--line);padding:18px 14px;gap:10px}
#app>aside .brand{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#app>aside .mut,#app>aside .small{color:var(--mut)}
#app>aside button{background:transparent;color:var(--ink);border-color:var(--ink)}
#app>aside button:hover:not(:disabled){background:var(--bg)}
#app>aside .pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#app>aside .pitem button{background:none;border:0}
#app>aside :focus-visible{outline-color:var(--ink)}
.sidebar-caption{margin:0}
.project-search{color:var(--mut)}
.project-search input{background:var(--field);border-color:var(--field-line);color:var(--ink)}
.project-search input::placeholder{color:var(--mut)}
.pitem{border-radius:4px}.pitem:hover{background:var(--bg)}
.pitem.on{background:var(--bg);border-color:var(--ink)}
.pitem .nm,.pitem .x{color:var(--ink)}
.lm{display:block;height:44px;width:auto}.lm-d{display:none;color:var(--ink)}
[data-theme=dark] .lm-l{display:none}[data-theme=dark] .lm-d{display:block}
main{background-image:none;padding:0 clamp(16px,2.2vw,40px) 100px}
.workspace-top{position:sticky;top:0;z-index:20;margin:0 calc(-1 * clamp(16px,2.2vw,40px));padding:8px clamp(16px,2.2vw,40px);min-height:56px;gap:20px;
 background:rgba(249,248,246,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
[data-theme=dark] .workspace-top{background:rgba(10,21,38,.85)}
.workspace-top .crumb{flex:0 1 240px}
.phases{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.ph{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:6px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:var(--mut)}
.ph:hover:not(:disabled){background:transparent;color:var(--ink);border-bottom-color:var(--line)}
.ph.on{color:var(--ink);border-bottom-color:var(--accent)}
.ph .phn{font:500 12px var(--mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor}
.ph.done:not(.on) .phn{color:var(--ok)}
.ph:disabled{opacity:.6}
.stepper{gap:2px;border-bottom:1px solid var(--line);margin:8px 0 18px;padding:0;overflow-x:auto;background:none;flex-wrap:nowrap}
.step{flex:0 0 auto;min-width:0;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 16px 7px 8px;margin-bottom:-1px}
.step:hover:not(:disabled):not(.on){background:var(--soft)}
.step .n{background:transparent;border:1px solid var(--mut);color:var(--mut);font-family:var(--mono)}
.step .slb small{font-family:var(--mono);color:var(--mut)}
.step.on{background:transparent;color:var(--ink);border-bottom-color:var(--accent)}
.step.on .n{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step.on .slb small{color:var(--mut);opacity:1}
.step.done:not(.on) .n{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
#foot{background:var(--bg);border-top:1px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none;left:232px;right:0;bottom:0;border-radius:0}
/* stage header + stat cards */
.stage-intro h2{font:500 32px/1.15 var(--serif);letter-spacing:-.02em}
.stage-intro p{color:var(--mut)}
.metric{background:var(--soft);border:1px solid var(--line);border-radius:6px;color:var(--ink);transition:border-color .3s var(--ease)}
.metric:nth-child(2),.metric:nth-child(3){background:var(--soft)}
.metric:hover{border-color:var(--ink)}
.metric strong{font:400 36px/1 var(--serif);letter-spacing:-.02em}
.metric span{font:500 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.metric small{font-size:12px;opacity:1;color:var(--mut)}
/* welcome */
.wv{position:relative;isolation:isolate}
.wv::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);opacity:.07;pointer-events:none;
 -webkit-mask:url(/assets/waves.svg) center/cover no-repeat;mask:url(/assets/waves.svg) center/cover no-repeat}
[data-theme=dark] .wv::before{opacity:.08}
.wv.anim::before{inset:-4%;animation:drift 50s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,0,0) scale(1.02)}to{transform:translate3d(2%,-1.5%,0) scale(1.06)}}
.welcome{padding:56px 0 32px;margin:0 0 80px;overflow:hidden;border-bottom:1px solid var(--line)}
.welcome h2{font:400 clamp(34px,4.2vw,56px)/1.1 var(--serif);letter-spacing:-.02em;max-width:900px;margin:8px 0 14px}
.welcome h2 strong{font-weight:500;font-style:italic;color:var(--accent-ink)}
.welcome p{color:var(--mut);font-size:16px;max-width:680px}
.entry-grid{margin-bottom:80px}.home-metrics{margin-bottom:80px}
.dz{border:1px solid var(--ink);background:transparent;position:relative;isolation:isolate}
.dz::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);opacity:.06;pointer-events:none;-webkit-mask:url(/assets/waves.svg) center/cover no-repeat;mask:url(/assets/waves.svg) center/cover no-repeat}
.dz.over,.dz:focus-visible{background:var(--accbg)}
.dz h3{font-size:20px}
.dzlogo{width:56px;height:56px;border-radius:2px}
.recent-empty.wv{min-height:160px}
.empty.wv{padding:26px;text-align:center}.empty.wv .cta{margin-top:6px}
.recent-project{border-radius:0}.recent-project:hover:not(:disabled){background:var(--soft)}
.help-details{padding:12px 18px}
/* result step */
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.side{min-width:0}.sidehd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line-strong);margin-bottom:12px;padding-bottom:6px}
.sidehd h2{font-size:24px;margin:0}
.branch{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px}
.rc6{margin:10px 0}.rc6 h3{font-size:18px}
.rec{font-size:16px;margin:4px 0}
.pl{padding:6px 0;border-top:1px solid var(--line);font-size:14px}.pl:first-of-type{border-top:0}
.more6{margin-top:24px}
.detail{max-width:900px;margin:0 auto 24px;padding:28px 32px}
.detail h2{font-size:34px;margin:4px 0 12px}
.kvt{width:auto;min-width:0;border-collapse:collapse;margin:0 0 8px}.kvt th{text-align:left;background:none;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:4px 24px 4px 0;border:0}.kvt td{padding:4px 0;border:0}
table.kvt{min-width:0}
@media(max-width:1000px){.sides{grid-template-columns:1fr}}
.print-foot{display:none}
@media print{.print-foot{display:flex;align-items:center;gap:12px;margin-top:24px;border-top:1px solid #0A1526;padding-top:8px;font-size:12px}.phases{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}button:hover{transform:none!important}}
/* mobile */
@media(max-width:900px){
 .workspace-top{flex-wrap:wrap;gap:6px}.phases{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
 #app>aside .lm{height:36px}.lm{height:36px}
 .welcome{padding:32px 0 24px;margin-bottom:40px}.entry-grid,.home-metrics{margin-bottom:40px}
 .detail{padding:18px}.stage-intro h2{font-size:26px}
 #foot{left:0}
}
.rc6 .chip{white-space:normal;max-width:100%;text-align:left}
.rc6 .row{align-items:flex-start}
[data-theme=dark] .step.on .n{background:var(--ink);color:var(--bg)}
.stepper{overflow:visible}@media(max-width:900px){.stepper{overflow-x:auto;overflow-y:hidden}}
/* rev3: Ask drawer floats with a clean 24px margin so its borders (and any highlight around them) are never clipped */
@media(min-width:901px){.askd{right:24px;top:24px;bottom:24px;border:1px solid var(--line);border-radius:18px}body.dock main{padding-right:436px}}
.askd .msgs{overflow-x:hidden}.askd .msg,.askd .msg *{overflow-wrap:anywhere;word-break:break-word;min-width:0;max-width:100%}.askd .chip{white-space:normal}
.askm{overflow-x:hidden}.askm>*{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}.askm .aq,.askm .small{overflow-wrap:anywhere;word-break:break-word}
</style>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nrm=s=>String(s??"").replace(/\s+/g,"").toLowerCase();
const uid=p=>p+Math.random().toString(16).slice(2,9);
const api=async(m,u,b,raw)=>{const r=await fetch("/api"+u,{method:m,headers:raw?{}:{"Content-Type":"application/json"},body:raw?b:(b===undefined?undefined:JSON.stringify(b))});
  const j=await r.json().catch(()=>({error:"invalid response"}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j};

const ROLES=[["materials","Materials"],["equipment","Equipment"],["conditions","Operating conditions"],["results","Results"],["software","Software"],["numerical","Numerical settings"]];
const ROLE_NAME=Object.fromEntries(ROLES);
const FST={verified:["c-ok","✔","Verified"],not_verified:["c-bad","✖","Unverified (not used as evidence)"],not_reported:["c-gray","∅","Not in the paper"],
 cited:["c-warn","↗","Refers to another source / SI"],graph:["c-warn","≈","Read from a graph, approximate"]};
const CST={match:["c-ok","✔","Match"],different:["c-bad","≠","Different"],within_range:["c-info","↔","Within paper range"],not_comparable:["c-warn","⚠","Not comparable"],not_yet_known:["c-gray","?","Unknown"]};
const VERDICT={real:"Real difference",normal:"Within normal variation",cannot_be_assessed:"Cannot be assessed yet"};
const CONF={low:"Low",medium:"Medium",high:"High"};
const UNC={measurement_error:"Measurement error",between_seed:"Between seeds",discretization:"Discretisation"};
const chip=(t,k,extra)=>{const c=t[k]||["c-gray","?",k||"-"];return `<span class="chip ${c[0]}" ${extra?`title="${esc(extra)}"`:""}><span aria-hidden="true">${c[1]}</span>${esc(c[2])}</span>`};
const fmt=v=>v==null?"":Array.isArray(v)?v.map(fmt).join("; "):typeof v==="object"?Object.entries(v).map(([k,x])=>k+": "+fmt(x)).join("; "):String(v);

let pr=null, step=1, comp={param:{},results:{}}, projects=[], curJob=null, pollT=null, verSel=null;
const ui={pq:"",role:"all",q:"",open:new Set(),add:false,filt2:"all",q2:"",v1:"flow",fig:"",fp:"",gf:"",gsel:"",v5:"rec",rv:"ctl",det:{},askOpen:false,askBusy:false,askPend:null,askStage:"",kw:"",kwc:"",cooc:null,coocBusy:false,litBusy:false,a5:{},ownq:"",relq:""};
const busy=()=>!!curJob;
async function openSettings(first){
  let S;try{S=await api("GET","/settings")}catch(e){return toast("Could not read settings: "+e.message)}
  const d=document.createElement("dialog");d.setAttribute("aria-label","Model settings");d.style.maxWidth="560px";
  const P={anthropic:"Anthropic API key",openai:"OpenAI-compatible API (OpenAI, OpenRouter, Ollama, LM Studio)",hermes:"Hermes sign-in (OAuth, no key)"};
  d.innerHTML=`<h3 style="margin:0 0 6px">${first?"Connect an AI model to start":"Model settings"}</h3>
   <p class="small mut" style="margin:0 0 12px">Lab Mate runs on your own account. Your key is stored only in <code>app/settings.json</code> on this computer and is never sent to the browser or to GitHub.</p>
   <label class="f">Provider<select id="sp">${S.providers.map(p=>`<option value="${p}" ${S.provider==p?"selected":""}>${esc(P[p])}</option>`).join("")}</select></label>
   <div id="sf"></div>
   <div class="small" id="sm" role="status" style="min-height:22px;margin:8px 0"></div>
   <div class="row" style="justify-content:flex-end"><button data-r="x">Close</button><button data-r="t">Test connection</button><button class="pri" data-r="s">Save</button></div>`;
  document.body.appendChild(d);
  const f=()=>{const p=$("#sp",d).value,m=S.defaults[p]||"";
    $("#sf",d).innerHTML=p=="anthropic"?`<label class="f">API key <span class="small mut">(${S.anthropic_key?"saved: "+esc(S.anthropic_key)+". Leave blank to keep it":"starts with sk-ant-"})</span><input id="k" type="password" autocomplete="off" placeholder="sk-ant-..."></label><label class="f">Model<input id="md" value="${esc(p==S.provider?S.model:m)}"></label><p class="small mut">Get a key at console.anthropic.com. Usage is billed to your account.</p>`
     :p=="openai"?`<label class="f">Base URL<input id="bu" value="${esc(S.openai_base)}"></label><label class="f">API key <span class="small mut">(${S.openai_key?"saved: "+esc(S.openai_key)+". Leave blank to keep it":"optional for local servers"})</span><input id="k" type="password" autocomplete="off"></label><label class="f">Model<input id="md" value="${esc(p==S.provider?S.model:m)}"></label><p class="small mut">Ollama: base URL http://localhost:11434/v1 and a model such as llama3.1. Quality of the diagnosis depends on the model.</p>`
     :`<p class="small">${S.hermes_found?"Hermes was found on this computer. Make sure you are signed in (run <code>hermes login</code> once in a terminal).":"Hermes was not found. Install Hermes first, or choose an API key."}</p><label class="f">Model (optional)<input id="md" value="${esc(p==S.provider?S.model:"")}" placeholder="leave blank for the Hermes default"></label>`};
  f();$("#sp",d).addEventListener("change",f);
  const body=()=>{const p=$("#sp",d).value,o={provider:p,model:($("#md",d)||{}).value||""};const k=$("#k",d);
    if(k&&k.value.trim())o[p+"_key"]=k.value.trim();if($("#bu",d))o.openai_base=$("#bu",d).value;return o};
  d.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b||!b.dataset.r)return;const m=$("#sm",d);
    if(b.dataset.r=="x")return d.close();
    try{S=await api("POST","/settings",body());m.textContent="Saved.";
      if(b.dataset.r=="t"){m.textContent="Testing…";const r=await api("POST","/settings/test",{});m.innerHTML=r.ok?"✔ Connected. You can close this window.":"✖ "+esc(r.message)}
      else d.close()}catch(x){m.textContent="✖ "+x.message}});
  d.addEventListener("close",()=>d.remove());d.showModal()}
async function checkModel(){try{const S=await api("GET","/settings");if(!S.configured)openSettings(true)}catch(e){}}
function ask(msg,ok="Continue"){return new Promise(res=>{const d=document.createElement("dialog");d.setAttribute("aria-label","Confirm");
  d.innerHTML=`<p style="margin:0 0 16px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button data-r="0">Cancel</button><button class="pri" data-r="1">${esc(ok)}</button></div>`;
  document.body.appendChild(d);d.addEventListener("click",e=>{const b=e.target.closest("button");if(b)d.close(b.dataset.r)});
  d.addEventListener("close",()=>{res(d.returnValue==="1");d.remove()});d.showModal();$(".pri",d).focus()})}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3800)}
function errBanner(stage,msg){$("#job").innerHTML=`<div class="banner err" role="alert"><b>Something went wrong while ${esc(stage)}.</b><br>${esc(msg)}<br><span class="small">No placeholder data is shown. <button class="lnk" data-act="dismiss">Dismiss</button></span></div>`}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.theme=t}
setTheme(localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));

let saveT=null,busyLit=false;
function saveSoon(){clearTimeout(saveT);setSaved("Saving…");saveT=setTimeout(saveNow,600)}
function setSaved(t){const e=$("#saved");if(e)e.textContent=t}
async function saveNow(){clearTimeout(saveT);if(!pr)return;const{pages,report,chat_user,...rest}=pr;
  try{await api("PUT","/projects/"+pr.id,rest);setSaved("All changes saved ✓")}catch(e){setSaved("Not saved");errBanner("saving the project",e.message)}}
async function recompute(){if(!pr)return;try{comp=await api("POST","/compare",{fields:pr.fields,compare:pr.compare,results:pr.results});paintStatus();updateCounts2()}catch(e){errBanner("computing statuses",e.message)}}
let dr=null;const debRecompute=()=>{clearTimeout(dr);dr=setTimeout(recompute,300)};
const hasCmp=()=>Object.values(pr.compare).some(v=>v&&String(v.value??"")!=="");

const IC={x:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',tr:'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>'};
function paintPlist(){const q=(ui.pq||"").toLowerCase(),L=projects.filter(p=>!q||p.name.toLowerCase().includes(q));
  $("#plist").innerHTML=L.map(p=>{const on=pr&&pr.id==p.id;return `<div class="pitem ${on?"on":""}" role="listitem"><button class="nm" data-open="${p.id}" ${on?'aria-current="true"':""} title="${esc(p.name)}">${p.fictional?"[FICTIONAL] ":""}${esc(p.name)}</button>${on?`<button class="x" data-act="close" aria-label="Close project ${esc(p.name)} (it stays saved)" title="Close (stays saved)">${IC.x}</button>`:""}<button class="x del" data-del="${p.id}" data-nm="${esc(p.name)}" aria-label="Delete project ${esc(p.name)} permanently" title="Delete permanently">${IC.tr}</button></div>`}).join("")||`<p class="small mut">${projects.length?"No project matches your search.":"No projects yet. Upload a paper to start."}</p>`}
async function listP(){projects=await api("GET","/projects");paintPlist()}
async function ensurePrefill(){if(pr&&pr.extracted&&!hasCmp()){await api("POST","/projects/"+pr.id+"/prefill",{});pr.compare=(await api("GET","/projects/"+pr.id)).compare}}
async function openP(id,keep){try{pr=await api("GET","/projects/"+id);pr.fields=pr.fields||[];pr.compare=pr.compare||{};pr.results=pr.results||[];pr.sim=pr.sim||{};pr.report=pr.report||[];pr.chat_user=pr.chat_user||[];
    localStorage.pid=id;verSel=null;if(!keep)step=+(localStorage["step."+id]||1);
    if(step===2)await ensurePrefill();
    await recompute();await listP();render()}catch(e){localStorage.removeItem("pid");pr=null;render()}}
async function go(n){ui.detail=null;step=n;if(pr)localStorage["step."+pr.id]=n;if(n===5&&pr&&!ui.a5[pr.id]){ui.a5[pr.id]=1;ui.askOpen=true}if(n===2){await ensurePrefill();await recompute()}render();window.scrollTo({top:0})}

function jobUI(j){const el=$("#job");if(!j){el.innerHTML="";return}
  if(j.status=="failed"){errBanner("running the job ("+(j.stage||"")+")",j.error);return}

       if(r.verified){f.verified=true;if(f.status=="not_verified")f.status="verified";f.edited=true;toast("Source verified on page "+f.page)}
       else{f.verified=false;if(f.status!="not_reported")f.status="not_verified";toast("Source NOT found on page "+f.page)}
       saveSoon();summary1();renderList1();recompute()}catch(x){toast(x.message)}return}
   case"figs":{t.disabled=true;t.textContent="Capturing…";try{await api("POST","/projects/"+pr.id+"/figures",{});await openP(pr.id,true)}catch(x){toast(x.message)}ui.v1="figs";return render()}
   case"mkgroups":return launch("/projects/"+pr.id+"/groups",{},async()=>{await openP(pr.id,true);ui.v1="list";render()});
   case"addtoggle":ui.add=!ui.add;$("#addbox").innerHTML=ui.add?addForm():"";if(ui.add)$("#an").focus();return;
   case"addok":{const name=$("#an").value.trim();if(!name){$("#am").textContent="Name is required.";return}
     const pg=+$("#ap").value||null,q=$("#aq").value.trim();let ok=false;if(pg&&q)ok=(await api("POST","/projects/"+pr.id+"/verify",{page:pg,quote:q})).verified;
     pr.fields.push({id:uid("f"),name,value:$("#av").value,unit:$("#au").value,role:$("#ar").value,quote:ok?q:"",page:ok?pg:null,verified:ok,status:ok?"verified":"not_verified",edited:true,once:false});
     ui.add=false;$("#addbox").innerHTML="";saveSoon();summary1();renderList1();return recompute()}
   case"reset":{const f=pr.fields.find(x=>x.id==d.fid);pr.compare[f.id]={value:f.value,unit:f.unit||"",tol:(pr.compare[f.id]||{}).tol||"5%",prefill:true};saveSoon();fillTable2();return recompute()}
   case"confirmall":try{await saveNow();const r=await api("POST","/projects/"+pr.id+"/confirm",{});Object.values(pr.compare).forEach(v=>delete v.prefill);toast(r.confirmed+" assumed rows confirmed");fillTable2()}catch(x){errBanner("confirming rows",x.message)}return;
   case"imp":return $("#impf").click();
   case"send":return sendChat();
   case"addh":pr.results.push({id:uid("h"),name:"",paper_fid:"",mode:"single",value:"",unit:"",replicates:"",uncertainty:"",uncertainty_kind:"measurement_error",definition:"",tol:"10%",table:[]});saveSoon();return render();
   case"delh":pr.results=pr.results.filter(x=>x.id!=d.hid);saveSoon();render();return recompute();
   case"diag":return diagnose();
   case"savehtml":case"savepdf":{const pdf=d.act=="savepdf",old=t.textContent;t.disabled=true;t.textContent=pdf?"Making PDF…":"Saving…";
     try{await saveNow();const r=await fetch("/api/projects/"+pr.id+"/report."+(pdf?"pdf":"html"));
       if(!r.ok){let m="";try{m=(await r.json()).error}catch(_){}throw new Error(m||("HTTP "+r.status))}
       const cd=r.headers.get("Content-Disposition")||"",fn=(/filename="([^"]+)"/.exec(cd)||[])[1]||("lab-mate-results."+(pdf?"pdf":"html")),b=await r.blob(),a=document.createElement("a");
       a.href=URL.createObjectURL(b);a.download=fn;a.click();toast("Saved "+fn+" (a copy is also in the app/saved folder)")}
     catch(x){toast("Could not save: "+x.message)}
     t.disabled=false;t.textContent=old;return}
   case"exmd":return dl("diagnosis-"+pr.id+".md",mdExport(),"text/markdown");
   case"exjs":{const{pages,...r}=pr;return dl("diagnosis-"+pr.id+".json",JSON.stringify(r,null,1),"application/json")}
   case"print":{if(step==3){const old=ui.rv;ui.rv="all";render();print();ui.rv=old;return render()}return print()}
   case"askopen":ui.askOpen=true;renderAsk();return setTimeout(()=>{const a=$("#aq2");a&&a.focus()},50);
   case"askclose":ui.askOpen=false;return renderAsk();
   case"asksend":return sendAsk();
   case"askkw":ui.askOpen=false;ui.kw=d.kw;ui.v5="kw";renderAsk();return go(5);
   case"mkcheck":return launch("/projects/"+pr.id+"/checklist",{},async()=>{await openP(pr.id,true);render()});
   case"graphgo":return launch("/projects/"+pr.id+"/graph",{},async s=>{if(s.status=="selesai"){await openP(pr.id,true);ui.fp="net";step=5;render()}});
   case"findgo":return launch("/projects/"+pr.id+"/find",{},async()=>{await openP(pr.id,true);ui.v5="rec";step=5;render()});
   case"owngo":{const q=($("#ownq")||{}).value||"";ui.ownq=q.trim();if(!ui.ownq){toast("Type some words, a title or a DOI");return}
     return launch("/projects/"+pr.id+"/find",{q:ui.ownq},async s=>{await openP(pr.id,true);ui.v5="rec";step=5;render();if(s.status=="failed")toast(s.error)})}
   case"relgo":{const q=(($("#relq")||{}).value||"").trim();ui.relq=q;if(!q){toast("Type a question about a result");return}
     return launch("/projects/"+pr.id+"/relate",{q},async()=>{await openP(pr.id,true);ui.v5="rel";step=5;render()})}
   case"relex":ui.relq=d.q;ui.v5="rel";return render();
   case"relfind":ui.ownq=d.q;ui.v5="rec";render();return setTimeout(()=>{const o=$("#ownq");o&&(o.focus(),o.scrollIntoView({block:"center"}))},50);
   case"askcand":{const R=d.set=="own"?pr.own_search:pr.recommendations,c=R.candidates.find(x=>x.id==d.cid);ui.askOpen=true;renderAsk();
     const ta=$("#aq2");if(ta){ta.value=`About paper ${c.id} ("${c.title.slice(0,90)}"): how could it help with my problem, and which hypothesis does it address?`;ta.focus()}return}
   case"litfetch2":{const R=d.set=="own"?pr.own_search:pr.recommendations,p=R.candidates.find(x=>x.id==d.cid);t.disabled=true;t.textContent="Downloading…";
     try{await api("POST","/projects/"+pr.id+"/lit/fetch",{url:p.pdf,name:p.title,doi:p.doi});pr.library=(await api("GET","/projects/"+pr.id)).library;toast("Added to your full-text set");t.textContent="Added ✔"}catch(x){t.disabled=false;t.textContent="Add to my full-text set";toast(x.message)}return}
   case"kwsug":return suggestKw();
   case"cooc":return runCooc();
   case"addsi":return $("#sif").click();
   case"litpick":return $("#litf").click();
   case"litrm":try{await api("DELETE","/projects/"+pr.id+"/lit/"+d.lid);pr.library=(await api("GET","/projects/"+pr.id)).library;render()}catch(x){toast(x.message)}return;
   case"litgo":return launch("/projects/"+pr.id+"/lit/analyse",{},async()=>{await openP(pr.id,true);ui.v5="lit";step=5;render()});
   case"litfetch":{const p=ui.cooc.items[+d.i];t.disabled=true;t.textContent="Downloading…";
     try{await api("POST","/projects/"+pr.id+"/lit/fetch",{url:p.pdf,name:p.title,doi:p.doi});pr.library=(await api("GET","/projects/"+pr.id)).library;toast("Added to your literature set");t.textContent="Added ✔"}catch(x){t.disabled=false;t.textContent="Add to my set";toast(x.message)}return}
  }});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="project-search"){ui.pq=t.value;return paintPlist()}
  if(t.id==="kw"){ui.kw=t.value;return}
  if(t.id==="kwc"){ui.kwc=t.value;return}
  if(t.id==="q1"){ui.q=t.value;return renderList1()}
  if(t.id==="q2"){ui.q2=t.value;return fillTable2()}
  const tr=t.closest("tr[data-fid]");
  if(tr&&t.dataset.c){const id=tr.dataset.fid,c=pr.compare[id]=pr.compare[id]||{tol:"5%"};c[t.dataset.c]=t.value;
    if(t.dataset.c!="tol")delete c.prefill;const f=pr.fields.find(x=>x.id==id);tr.classList.toggle("chg",isChanged(f,c));
    const sm=tr.querySelector(".st2");if(sm)sm.textContent=c.prefill?"= paper (assumed)":isChanged(f,c)?"changed by you":"";
    saveSoon();debRecompute();return}
  const hc=t.closest("[data-hid]");
  if(hc&&t.dataset.h&&t.tagName!=="SELECT"){const r=pr.results.find(x=>x.id==hc.dataset.hid),k=t.dataset.h;
    if(k=="tabelraw")r.table=t.value.split("\n").filter(Boolean).map(x=>x.split(","));else r[k]=t.value;saveSoon();debRecompute();return}
  if(t.dataset.s){pr.sim[t.dataset.s]=t.value;saveSoon()}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.id==="gfocus"){ui.gf=t.value;ui.gsel="";return refreshGraph()}
  if(t.id==="fi")return upload(t.files);
  if(t.dataset.chk){(pr.chk=pr.chk||{})[t.dataset.chk]=t.checked;saveSoon();return clCount()}
  if(t.id==="sif"&&t.files[0]){const f=t.files[0];try{await saveNow();const r=await api("POST","/projects/"+pr.id+"/attach?name="+encodeURIComponent(f.name),await f.arrayBuffer(),true);
      pr=await api("GET","/projects/"+pr.id);pr.fields=pr.fields||[];pr.compare=pr.compare||{};pr.results=pr.results||[];pr.sim=pr.sim||{};pr.report=pr.report||[];pr.chat_user=pr.chat_user||[];
      toast("Added "+r.n+" page(s) of supplementary information. Press “Extract again” so the assistant reads them.");render()}catch(x){errBanner("adding the supplementary information",x.message)}t.value="";return}
  if(t.id==="litf"&&t.files.length){busyLit=true;try{await saveNow();for(const f of t.files){try{await api("POST","/projects/"+pr.id+"/lit?name="+encodeURIComponent(f.name),await f.arrayBuffer(),true)}catch(x){toast(f.name+": "+x.message)}}
      pr.library=(await api("GET","/projects/"+pr.id)).library;ui.v5="lit";render()}catch(x){errBanner("adding papers",x.message)}busyLit=false;t.value="";return}
  if(t.id==="impf"){try{const j=JSON.parse(await t.files[0].text());pr=await api("POST","/projects/"+pr.id+"/import_user",j);await recompute();await listP();render()}catch(x){errBanner("importing user data",x.message)}return}
  if(t.id==="chkf"){pr.fictional=t.checked;saveSoon();await listP();return render()}
  if(t.id==="ver"){verSel=+t.value;return render()}
  const row=t.closest(".prow");
  if(row&&t.dataset.k){const f=pr.fields.find(x=>x.id==row.dataset.fid),k=t.dataset.k;let v=t.value;if(k=="page")v=v?parseInt(v):null;
    if(f[k]!==v){f[k]=v;f.edited=true;if(["quote","page"].includes(k)&&f.verified){f.verified=false;if(f.status!="not_reported")f.status="not_verified"}
      saveSoon();summary1();renderList1();recompute()}return}
  const hc=t.closest("[data-hid]");
  if(hc){const r=pr.results.find(x=>x.id==hc.dataset.hid);
    if(t.dataset.csv!==undefined){r.table=(await t.files[0].text()).split(/\r?\n/).filter(Boolean).map(x=>x.split(","));saveSoon();recompute();return render()}
    if(t.tagName==="SELECT"&&t.dataset.h){r[t.dataset.h]=t.value;saveSoon();debRecompute();if(t.dataset.h=="mode")render()}}});
document.addEventListener("toggle",e=>{const k=e.target.dataset&&e.target.dataset.det;if(k)ui.det[k]=e.target.open},true);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ownq"){const b=$("[data-act=owngo]");b&&b.click()}if(e.ctrlKey&&e.key==="Enter"&&e.target.id==="aq2")sendAsk();if(e.key==="Escape"&&ui.askOpen){ui.askOpen=false;renderAsk()}if(e.ctrlKey&&e.key==="Enter"&&e.target.id==="ct")sendChat();if(e.key==="Escape"&&ui.open.size&&step==1){ui.open.clear();renderList1()}});

(async()=>{try{await listP()}catch(e){$("#view").innerHTML=`<div class="banner err">The server is not responding: ${esc(e.message)}</div>`;return}
  checkModel();
  const id=localStorage.pid;if(id&&projects.some(p=>p.id==id))await openP(id);else render();
  const jid=localStorage.job;if(jid){try{const s=await api("GET","/job/"+jid);if(s.status=="running"||s.status=="queued")startPoll(s,async()=>{await openP(pr.id,true);render()});else localStorage.removeItem("job")}catch(e){localStorage.removeItem("job")}}})();
</script>
</body>
</html>
